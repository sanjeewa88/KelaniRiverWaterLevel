<!DOCTYPE html>
<html>
<head>
  <title>Kelani River Water Level</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f3;
      text-align: center;
      padding-top: 40px;
    }
    #widget {
      background: white;
      width: 300px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #value {
      font-size: 32px;
      font-weight: bold;
      color: #0077cc;
    }
    #time {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div id="widget">
  <h3>Kelani River Water Level</h3>
  <div id="value">Loading…</div>
  <div id="time"></div>
</div>

<script>
  async function loadData() {
    document.getElementById("value").innerText = "Waiting for data…";
    document.getElementById("time").innerText = "CORS blocking direct data";
  }
  loadData();
</script>

</body>
</html>
